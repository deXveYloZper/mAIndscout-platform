# Local development infrastructure. Postgres only for now (Slice 0).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: maindscout
      POSTGRES_PASSWORD: maindscout_dev
      POSTGRES_DB: maindscout
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maindscout"]
      interval: 3s
      retries: 20
volumes:
  pgdata:
